      - name: Add isolated C preview and verify original site unchanged
        shell: bash
        run: |
          python3 - <<'PYPREVIEW'
          from pathlib import Path
          import base64,hashlib,io,json,shutil,zipfile
          sha=lambda b:hashlib.sha256(b).hexdigest()
          root=Path('_site');stage=Path('_rinne_c_preview_site')
          def hashes(folder):
              return {p.relative_to(folder).as_posix():sha(p.read_bytes()) for p in sorted(folder.rglob('*')) if p.is_file()}
          before=hashes(root)
          raw=base64.b64decode(Path('_rinne_c_preview.b64').read_text(),validate=True)
          assert sha(raw)=='aa88734b20d21df8ac5ed484aea3b6a1844a46bbaadd22458c1b8f34dfc5e586', 'C preview payload differs'
          allowed={'engine_browser.js','bot.js','ui.js','index.html','release.json','EXPERIMENT_RULES.html'}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert len(z.namelist())==7 and set(z.namelist())==allowed|{'manifest.json'}
              m=json.loads(z.read('manifest.json'))
              assert before==m['base_files'], 'Current release differs: preserve it and stop instead of deploying stale preview'
              assert set(m['files'])==allowed
              assert not stage.exists()
              shutil.copytree(root,stage)
              for name,expected in m['files'].items():
                  data=z.read(name)
                  assert sha(data)==expected,name
                  (stage/name).write_bytes(data)
          assert hashes(stage)==m['candidate_files'], 'C candidate file mismatch'
          assert hashes(root)==before, 'Main site was changed while preparing preview'
          target=root/m['test_subdirectory']
          assert not target.exists()
          shutil.move(str(stage),str(target))
          assert hashes(target)==m['candidate_files']
          after={k:v for k,v in hashes(root).items() if not k.startswith(m['test_subdirectory']+'/')}
          assert after==before, 'Main site must remain byte-identical'
          print(m['release'],'469 candidate files verified; 468 existing public files unchanged; preview at /Rinne/test-item-cycle/')
          PYPREVIEW
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy original site plus isolated C preview
        id: deployment
        uses: actions/deploy-pages@v4


