name: Publish RINNE C isolated preview
on:
  workflow_run:
    workflows: ["Publish audited RINNE candidate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify and unpack audited game
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          m=json.loads(Path('payload-manifest.json').read_text())
          dest=Path('_site');dest.mkdir(exist_ok=True)
          seen=set()
          for part in m['parts']:
              p=Path(part['name'])
              assert p.is_file(),f'Missing upload: {p}'
              assert hashlib.sha256(p.read_bytes()).hexdigest()==part['sha256'],f'Bad upload: {p}'
              with zipfile.ZipFile(p) as z:
                  for item in z.infolist():
                      path=Path(item.filename)
                      assert not path.is_absolute() and '..' not in path.parts
                      assert item.filename not in seen
                      assert item.filename in m['files']
                      seen.add(item.filename)
                  z.extractall(dest)
          assert seen==set(m['files']), 'Incomplete or unexpected site files'
          for name,expected in m['files'].items():
              assert hashlib.sha256((dest/name).read_bytes()).hexdigest()==expected,name
          assert (dest/'index.html').is_file()
          print(m['release'],len(seen),'verified files')
          PY
      - name: Apply verified UI-only update
        shell: bash
        run: |
          python3 - <<'PYUI'
          from pathlib import Path
          import hashlib,json,zipfile
          source=Path('rinne-ui-update-01.zip');dest=Path('_site')
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='aeef549c260f0a132ce0c330764b3e2d64dc40669e62a151f4e478a1d1c6781f', 'UI update file differs'
          allowed={'index.html','ui.js','ui_update.css','release.json'}
          with zipfile.ZipFile(source) as z:
              assert len(z.namelist())==5 and set(z.namelist())==allowed|{'manifest.json'}, 'Unexpected UI patch scope'
              patch=json.loads(z.read('manifest.json'))
              assert set(patch['files'])==allowed
              for name,expected in patch['files'].items():
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==expected,name
                  (dest/name).write_bytes(data)
          baseline=json.loads(Path('payload-manifest.json').read_text())
          for name,expected in baseline['files'].items():
              if name not in allowed:
                  assert hashlib.sha256((dest/name).read_bytes()).hexdigest()==expected,name
          print(patch['release'],'UI update verified; engine, CPU, data, all images unchanged')
          PYUI
      - name: Stage verified C preview payload 1 of 14
        shell: bash
        run: |
          python3 - <<'PYCHUNK'
          from pathlib import Path
          with Path('_rinne_c_preview.b64').open('w', encoding='ascii') as f:
              f.write('')
          PYCHUNK
